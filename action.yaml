# rust-crate-publish-action
name: "🦀 Rust Crate Publish"
# yamllint disable-line rule:line-length
description: "Packages a Rust crate, checks its size and version, and publishes it to crates.io"
# Stages: read metadata, verify the release tag, 'cargo package', check
# the .crate size, 'cargo publish --dry-run', confirm the archive is
# unchanged, then upload. For isolation from crate code, verify in an
# unprivileged dry_run job and upload from a credentialed job given
# expected_sha256, which compiles nothing.
# The calling workflow owns authentication, typically crates.io
# Trusted Publishing via rust-lang/crates-io-auth-action.

inputs:
  # Optional
  path_prefix:
    # yamllint disable-line rule:line-length
    description: "Directory holding the crate or workspace, inside the workspace"
    required: false
    default: "."
  manifest_path:
    description: "Path to the crate's Cargo.toml, relative to path_prefix"
    required: false
    default: "Cargo.toml"
  release_tag:
    # yamllint disable-line rule:line-length
    description: "Release tag that the Cargo.toml version must match, one leading 'v' ignored; empty skips the check"
    required: false
    default: ""
  max_crate_size_bytes:
    # yamllint disable-line rule:line-length
    description: "Largest allowed packaged .crate size in bytes (crates.io cap: 10MB)"
    required: false
    default: "10485760"
  dry_run:
    # yamllint disable-line rule:line-length
    description: "Check and package without publishing ('true'/'false'); needs no credentials"
    required: false
    default: "false"
  registry_token:
    # yamllint disable-line rule:line-length
    description: "crates.io token for the upload alone; empty uses the caller's Cargo credentials"
    required: false
    default: ""
  expected_sha256:
    # yamllint disable-line rule:line-length
    description: "crate_sha256 from an earlier dry_run job; skips compilation and uploads only that archive"
    required: false
    default: ""
  permit_fail:
    description: "Report success even when a stage fails ('true'/'false')"
    required: false
    default: "false"
  summary:
    description: "Write a crate table to the job summary ('true'/'false')"
    required: false
    default: "true"

outputs:
  crate_name:
    description: "Crate name, read from its Cargo.toml"
    value: ${{ steps.publish.outputs.crate_name }}
  crate_version:
    description: "Crate version, read from its Cargo.toml"
    value: ${{ steps.publish.outputs.crate_version }}
  crate_size_bytes:
    description: "Packaged .crate file size in bytes"
    value: ${{ steps.publish.outputs.crate_size_bytes }}
  crate_sha256:
    description: "SHA-256 of the verified .crate, as crates.io records it"
    value: ${{ steps.publish.outputs.crate_sha256 }}
  published:
    description: "'true' when the crate reached crates.io, otherwise 'false'"
    value: ${{ steps.publish.outputs.published }}

runs:
  using: "composite"
  steps:
    - name: "Check, package and publish crate"
      id: publish
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        INPUT_MAX_CRATE_SIZE_BYTES: ${{ inputs.max_crate_size_bytes }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry_token }}
        INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: bash "$ACTION_PATH/scripts/publish-crate.sh"
